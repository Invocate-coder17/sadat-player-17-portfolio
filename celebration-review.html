<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Player 17 | Celebration film</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#050c14;color:#eef4fb;font:14px system-ui}
    main{height:100dvh;display:grid;grid-template-rows:1fr auto}
    video{width:100%;height:100%;min-height:0;object-fit:contain}
    footer{padding:15px 22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;border-top:1px solid #274357;background:#0b1623}
    button,a{background:none;color:inherit;border:1px solid #355266;padding:10px 14px;text-decoration:none;cursor:pointer}
    label{display:flex;gap:10px;align-items:center}
    small{color:#a6bacb;max-width:470px;font-size:11px}
    input{accent-color:#45c7f5;max-width:35vw}
  </style>
</head>
<body>
  <main>
    <video id="testFilm" muted playsinline controls preload="metadata" poster="./assets/celebration-handshake-start.png" aria-label="Fictional celebration film with Sadat Junaid Akunjee and Sergio Ramos García">
      <source src="./assets/celebration-film-v2.mp4" type="video/mp4">
    </video>
    <footer>
      <button id="play" type="button">PLAY CELEBRATION</button>
      <label>FRAME REVIEW <input id="time" type="range" min="0" max="10" step=".01" value="0" aria-label="Celebration film time"></label>
      <a href="./#standard">PORTFOLIO ↗</a>
      <small>FICTIONAL AI-GENERATED FAN TRIBUTE · NOT REAL MEETING FOOTAGE OR ENDORSEMENT.<br>Sadat Junaid Akunjee × Sergio Ramos García</small>
    </footer>
  </main>
  <script>
    const video=document.getElementById('testFilm');
    const time=document.getElementById('time');
    const play=document.getElementById('play');
    play.addEventListener('click',()=>{
      if(video.paused){
        if(video.ended)video.currentTime=0;
        video.play().catch(()=>{play.textContent='PLAY CELEBRATION';});
      }else{video.pause();}
    });
    video.addEventListener('loadedmetadata',()=>{time.max=video.duration;});
    video.addEventListener('play',()=>{play.textContent='PAUSE CELEBRATION';});
    video.addEventListener('pause',()=>{play.textContent='PLAY CELEBRATION';});
    video.addEventListener('timeupdate',()=>{if(!video.seeking)time.value=video.currentTime;});
    time.addEventListener('input',()=>{
      const selected=Number(time.value);
      video.pause();
      video.currentTime=selected;
    });
  </script>
</body>
</html>
