<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Player 17 | Energy sweep review</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#010308;color:#dbeafa;font:13px system-ui,sans-serif}
    main{height:calc(100dvh - 92px);min-height:280px;position:relative}canvas{display:block;width:100%;height:100%}
    .ident{position:absolute;left:5%;bottom:12%;display:grid;gap:6px;pointer-events:none}
    small{font-size:9px;letter-spacing:.25em;color:#a5b3d4}
    b{font:900 clamp(36px,7vw,90px)/.9 Impact,'Arial Narrow',sans-serif;letter-spacing:.02em}
    .controls{padding:15px 5%;display:flex;gap:16px;flex-wrap:wrap;align-items:center;border-top:1px solid #18243d}
    button{color:#dbeafa;background:#0b1425;border:1px solid #3b588b;padding:10px;cursor:pointer}
    input{flex:1;min-width:100px;accent-color:#5b68ff}a{color:#8cccf5;font-size:11px}
    output{font-variant-numeric:tabular-nums;width:36px}
  </style>
</head>
<body>
  <main><canvas id="sweep" aria-label="Blue and violet energy sweeping across a dark screen"></canvas><div class="ident"><small>PLAYER 17</small><b>FLOW STATE</b><small>AWAKENING</small></div></main>
  <div class="controls">
    <button id="play" type="button">PLAY SWEEP</button>
    <input id="time" type="range" min="0" max="2.25" step="0.01" value="1.1" aria-label="Energy sweep time">
    <output id="stamp">1.10s</output>
    <a href="./#kickoff">OPEN COMPLETE INTRO ↗</a>
  </div>
  <script type="module">
    import {createEnergySweep} from './src/flow-vfx.js';
    import {ENERGY_SWEEP_DURATION} from './src/intro-timeline.js';
    const sweep=createEnergySweep(document.getElementById('sweep'));
    const time=document.getElementById('time'),stamp=document.getElementById('stamp'),play=document.getElementById('play');
    let frame,start;
    function render(seconds){time.value=seconds;stamp.textContent=Number(seconds).toFixed(2)+'s';sweep.render(seconds/ENERGY_SWEEP_DURATION);}
    render(time.value);
    time.addEventListener('input',()=>{cancelAnimationFrame(frame);play.textContent='PLAY SWEEP';render(time.value);});
    play.addEventListener('click',()=>{
      cancelAnimationFrame(frame);start=performance.now();play.textContent='REPLAY SWEEP';
      function tick(now){
        const seconds=Math.min(ENERGY_SWEEP_DURATION,(now-start)/1000);
        render(seconds);if(seconds<ENERGY_SWEEP_DURATION)frame=requestAnimationFrame(tick);
      }
      frame=requestAnimationFrame(tick);
    });
    addEventListener('resize',()=>{sweep.resize();render(time.value);});
  </script>
</body>
</html>
